<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="62%" stop-color="#0b0b0d"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <linearGradient id="petal" x1="512" y1="250" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8435c" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#a41f33" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#5c0e1b" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="petalEdge" x1="512" y1="260" x2="512" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb3c0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb3c0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c7ce"/>
      <stop offset="45%" stop-color="#c3364d"/>
      <stop offset="100%" stop-color="#710f1f"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="404" fill="none" stroke="#c3364d" stroke-opacity="0.10" stroke-width="3"/>

  <g filter="url(#soft)">
    <!-- six recurved petals -->
    <g>
      <path d="M512 512 C 472 440, 466 350, 500 262 C 508 242, 516 242, 524 262 C 558 350, 552 440, 512 512 Z" fill="url(#petal)" stroke="#e2687c" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M512 500 C 498 430, 498 360, 512 300" fill="none" stroke="url(#petalEdge)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="rotate(60 512 512)">
      <path d="M512 512 C 472 440, 466 350, 500 262 C 508 242, 516 242, 524 262 C 558 350, 552 440, 512 512 Z" fill="url(#petal)" stroke="#e2687c" stroke-opacity="0.15" stroke-width="2"/>
    </g>
    <g transform="rotate(120 512 512)">
      <path d="M512 512 C 472 440, 466 350, 500 262 C 508 242, 516 242, 524 262 C 558 350, 552 440, 512 512 Z" fill="url(#petal)" stroke="#e2687c" stroke-opacity="0.15" stroke-width="2"/>
    </g>
    <g transform="rotate(180 512 512)">
      <path d="M512 512 C 472 440, 466 350, 500 262 C 508 242, 516 242, 524 262 C 558 350, 552 440, 512 512 Z" fill="url(#petal)" stroke="#e2687c" stroke-opacity="0.15" stroke-width="2"/>
    </g>
    <g transform="rotate(240 512 512)">
      <path d="M512 512 C 472 440, 466 350, 500 262 C 508 242, 516 242, 524 262 C 558 350, 552 440, 512 512 Z" fill="url(#petal)" stroke="#e2687c" stroke-opacity="0.15" stroke-width="2"/>
    </g>
    <g transform="rotate(300 512 512)">
      <path d="M512 512 C 472 440, 466 350, 500 262 C 508 242, 516 242, 524 262 C 558 350, 552 440, 512 512 Z" fill="url(#petal)" stroke="#e2687c" stroke-opacity="0.15" stroke-width="2"/>
    </g>

    <!-- long filaments with anthers -->
    <g stroke="#d24a5e" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M512 512 C 494 438, 470 372, 430 318"/>
      <path d="M512 512 C 530 438, 554 372, 594 318"/>
      <path d="M512 512 C 472 500, 408 486, 344 482"/>
      <path d="M512 512 C 552 500, 616 486, 680 482"/>
      <path d="M512 512 C 486 548, 446 596, 408 648"/>
      <path d="M512 512 C 538 548, 578 596, 616 648"/>
    </g>
    <g fill="#e8a3af">
      <circle cx="430" cy="318" r="9"/>
      <circle cx="594" cy="318" r="9"/>
      <circle cx="344" cy="482" r="9"/>
      <circle cx="680" cy="482" r="9"/>
      <circle cx="408" cy="648" r="9"/>
      <circle cx="616" cy="648" r="9"/>
    </g>

    <circle cx="512" cy="512" r="34" fill="url(#core)"/>
    <circle cx="512" cy="512" r="34" fill="none" stroke="#f6d7dc" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
