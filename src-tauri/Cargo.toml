[package]
name = "rawjan"
version = "0.1.0"
description = "Rawjan — private, local-first personal finance"
authors = ["Fadlelmula"]
license = "MIT"
repository = "https://github.com/Fadlelmula/rawjan"
edition = "2021"
rust-version = "1.89"

[lib]
name = "rawjan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl", "backup", "chrono", "functions"] }

rust_decimal = { version = "1.43", features = ["serde-with-str", "maths"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

keyring = "4"
argon2 = { version = "0.6", features = ["kdf"] }
chacha20poly1305 = "0.11"
getrandom = "0.3"
zeroize = "1.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

csv = "1.4"
calamine = { version = "0.38", features = ["dates"] }
regex = "1"

log = "0.4"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
