# CI mirrors the local development checks:
#   npm run typecheck / npm test / npm run build
#   cargo fmt --check / cargo clippy --all-targets / cargo test
#
# The Rust build compiles SQLCipher with a vendored OpenSSL, which needs a
# Perl toolchain on Windows (the same reason scripts/build.bat points at
# Strawberry Perl locally).

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Typecheck, test, lint, build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Frontend typecheck, tests and production build
        shell: cmd
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Perl for the vendored OpenSSL build
        shell: pwsh
        run: choco install strawberryperl -y --no-progress

      - name: Rust formatting
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        shell: pwsh
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo test --manifest-path src-tauri/Cargo.toml
